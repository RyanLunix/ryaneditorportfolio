<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ryan — Editor de vídeos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--red:#9a2a20;--red2:#c23a2c;--ink:#0d0a0a;--bone:#e8d3bd;--white:#fff;
--bg:#f4e8d9;--fg:#14100f;--card:#fff;--line:#0d0a0a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171110;--fg:#f4e8d9;--card:#241a18;--line:#000;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171110;--fg:#f4e8d9;--card:#241a18;--line:#000;color-scheme:dark}
html{scroll-behavior:smooth;scroll-padding-top:70px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.5;overflow-x:hidden}
h1,h2,h3{font-family:"Dela Gothic One","Arial Black",sans-serif;font-weight:400;line-height:1;margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--red2);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
section{padding:84px 0}
/* nav */
nav{position:fixed;top:0;left:0;right:0;z-index:20;padding-top:env(safe-area-inset-top,0px);background:var(--ink);border-bottom:4px solid var(--red)}
nav .wrap{display:flex;align-items:center;gap:18px;height:58px}
nav b{font-family:"Dela Gothic One",sans-serif;color:var(--bone);font-weight:400;font-size:20px;margin-right:auto}
nav a{color:var(--bone);text-decoration:none;font-weight:600;font-size:14px}
nav a:hover{color:var(--red2)}
nav .cta{background:var(--red);padding:8px 14px;border:2px solid var(--bone);border-radius:8px}
@media(max-width:720px){nav a{display:none}}
/* hero */
.hero{background:var(--red);color:var(--bone);padding:120px 0 0;position:relative;overflow:hidden;
background-image:radial-gradient(rgba(0,0,0,.22) 2px,transparent 2.5px);background-size:14px 14px}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:end}
.hero h1{font-size:clamp(54px,11vw,128px);color:var(--bone);text-shadow:6px 6px 0 var(--ink);letter-spacing:-2px}
.hero h1 span{display:block;font-size:.34em;letter-spacing:0;color:var(--white);text-shadow:3px 3px 0 var(--ink);margin-top:14px}
.hero p{font-size:19px;max-width:30ch;margin:22px 0 28px;font-weight:600}
.btn{display:inline-block;background:var(--bone);color:var(--ink);font-weight:800;text-decoration:none;padding:14px 22px;border:3px solid var(--ink);border-radius:10px;box-shadow:5px 5px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.btn svg{width:22px;height:22px;vertical-align:-5px;fill:currentColor}
.btn.dark{background:var(--ink);color:var(--bone);border-color:var(--bone);box-shadow:5px 5px 0 var(--bone);margin-left:8px}
.hero .wrap>div:first-child{padding-bottom:72px}
.stage{position:relative;justify-self:center;width:min(420px,88vw);padding-bottom:30px}
.ryan{display:block;width:100%;border-radius:30px;border:6px solid var(--white);box-shadow:0 0 0 5px var(--ink),12px 14px 0 5px var(--ink);cursor:pointer;
transition:transform .35s cubic-bezier(.3,1.6,.5,1);user-select:none;-webkit-user-drag:none}
.ryan:hover{transform:rotate(-3deg) scale(1.05)}
.bob{animation:float 5s ease-in-out infinite}
.hop.jump{animation:jump .7s cubic-bezier(.3,1.4,.5,1)}
.mad{z-index:5;position:absolute;top:-26px;left:-34px;font-size:64px;animation:pulse 1.1s infinite;pointer-events:none;filter:drop-shadow(3px 3px 0 var(--ink))}
.bubble{position:absolute;top:-8px;right:-6px;max-width:190px;background:var(--white);color:var(--ink);border:3px solid var(--ink);border-radius:16px 16px 16px 2px;padding:9px 13px;font-weight:800;font-size:14px;transform:scale(0) rotate(4deg);transform-origin:bottom left;transition:transform .25s cubic-bezier(.3,1.7,.5,1)}
.bubble.on{transform:scale(1) rotate(4deg)}
@media(max-width:820px){.hint{display:none}.stage{padding-bottom:0}}
.hint{position:absolute;bottom:0;left:0;right:0;text-align:center;font-size:13px;font-weight:600;opacity:.85}
.slap{animation:slap .55s cubic-bezier(.2,1.8,.4,1) both}
.d1{animation-delay:.15s}.d2{animation-delay:.35s}.d3{animation-delay:.55s}
@keyframes slap{from{transform:scale(2.4) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-12px) rotate(1.5deg)}}
@keyframes wiggle{25%{transform:rotate(-4deg) scale(1.03)}75%{transform:rotate(4deg) scale(1.03)}}
@keyframes jump{0%,100%{transform:none}30%{transform:translateY(-60px) rotate(-6deg) scale(1.06)}60%{transform:translateY(0) scale(.96,1.04)}}
@keyframes pulse{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.3) rotate(-10deg)}}
@media(max-width:820px){.hero .wrap{grid-template-columns:1fr}.stage{order:-1;margin-top:10px}}
/* tape */
.tape{background:var(--ink);color:var(--bone);border-block:4px solid var(--bone);transform:rotate(-1.5deg);margin:-30px -20px;overflow:hidden;position:relative;z-index:5}
.tape div{display:flex;gap:40px;width:max-content;padding:12px 40px 12px 0;font-family:"Dela Gothic One",sans-serif;font-size:22px;animation:run 48s linear infinite}
@keyframes run{to{transform:translateX(-50%)}}
/* títulos */
.title{font-size:clamp(34px,6vw,60px);margin-bottom:12px;display:inline-block;background:var(--red);color:var(--bone);padding:8px 18px;border:4px solid var(--line);box-shadow:7px 7px 0 var(--line);transform:rotate(-1.2deg)}
.sub{margin:18px 0 34px;font-size:18px;max-width:50ch}
.chips{display:flex;flex-wrap:wrap;gap:12px}
.chip{background:var(--card);border:3px solid var(--line);border-radius:999px;padding:10px 18px;font-weight:800;box-shadow:4px 4px 0 var(--line)}
.chip:nth-child(odd){transform:rotate(-2deg)}.chip:nth-child(even){transform:rotate(1.5deg);background:var(--bone);color:var(--ink)}
/* portfólio */
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:28px}
.filters button{font:inherit;font-weight:800;cursor:pointer;background:var(--card);color:var(--fg);border:3px solid var(--line);border-radius:10px;padding:8px 16px;box-shadow:3px 3px 0 var(--line)}
.filters button[aria-pressed="true"]{background:var(--red);color:var(--bone);transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:26px}
.vid{display:block;text-decoration:none;background:var(--card);border:4px solid var(--line);border-radius:14px;box-shadow:7px 7px 0 var(--line);overflow:hidden;transition:transform .15s,box-shadow .15s}
.vid:nth-child(3n+1){transform:rotate(-1deg)}.vid:nth-child(3n+2){transform:rotate(.8deg)}
.vid:hover{transform:rotate(0) translateY(-6px);box-shadow:7px 13px 0 var(--red)}
.thumb{aspect-ratio:16/9;background:var(--red);background-image:radial-gradient(rgba(0,0,0,.25) 2px,transparent 2.5px);background-size:12px 12px;display:grid;place-items:center;position:relative;border-bottom:4px solid var(--line)}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb i{font-style:normal;color:var(--bone);font-family:"Dela Gothic One",sans-serif;text-align:center;padding:10px;font-size:15px}
.play{position:absolute;right:10px;bottom:10px;width:42px;height:42px;border-radius:50%;background:var(--bone);color:var(--ink);border:3px solid var(--ink);display:grid;place-items:center;font-size:15px}
.vid h3{font-size:16px;padding:14px 16px 4px;line-height:1.25}
.vid small{display:block;padding:0 16px 14px;font-weight:600;opacity:.7}
.grid.sh{grid-template-columns:repeat(auto-fill,minmax(min(200px,100%),1fr));gap:24px}
.grid.sh .thumb{aspect-ratio:9/16}
.grid.sh .vid h3{font-size:15px;padding:12px 14px 4px}
.grid.sh .vid small{padding:0 14px 12px}
@media(max-width:560px){.grid.sh{grid-template-columns:repeat(2,1fr);gap:16px}.grid.sh .vid{box-shadow:5px 5px 0 var(--line)}.grid.sh .vid h3{font-size:13px}}
/* serviços */
.svc{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px}
.card{background:var(--card);border:4px solid var(--line);border-radius:16px;padding:24px;box-shadow:7px 7px 0 var(--line)}
.card .em{font-size:38px;display:block;margin-bottom:10px}
.card h3{font-size:20px;margin-bottom:10px}
.card p{margin:0}
.price{background:var(--bone);color:var(--ink)}
.price strong{display:block;font-family:"Dela Gothic One",sans-serif;font-size:26px;margin-top:12px;color:var(--red)}
.note{margin-top:22px;font-weight:600;opacity:.8}
/* sobre */
.about{background:var(--ink);color:var(--bone)}
.about .wrap{display:grid;grid-template-columns:.8fr 1.2fr;gap:44px;align-items:center}
.about .ryan{transform:rotate(-4deg);box-shadow:0 0 0 5px var(--red),12px 14px 0 5px var(--red)}
.about .ryan:hover{transform:rotate(2deg) scale(1.05)}
.about .title{background:var(--bone);color:var(--ink);border-color:var(--red);box-shadow:7px 7px 0 var(--red)}
.about p{font-size:19px;max-width:48ch}
@media(max-width:820px){.about .wrap{grid-template-columns:1fr}}
/* passos */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:30px;counter-reset:s}
.step{position:relative;background:var(--card);border:4px solid var(--line);border-radius:14px;padding:30px 20px 20px;box-shadow:6px 6px 0 var(--line)}
.step::before{counter-increment:s;content:counter(s);position:absolute;top:-22px;left:16px;width:46px;height:46px;display:grid;place-items:center;background:var(--red);color:var(--bone);border:4px solid var(--line);border-radius:50%;font-family:"Dela Gothic One",sans-serif}
.step h3{font-size:19px;margin-bottom:6px}
/* contato */
.contact{background:var(--red);color:var(--bone);background-image:radial-gradient(rgba(0,0,0,.22) 2px,transparent 2.5px);background-size:14px 14px;text-align:center}
.contact h2{font-size:clamp(36px,7vw,72px);text-shadow:5px 5px 0 var(--ink)}
.contact p{font-size:19px;font-weight:600}
.links{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin-top:26px}
footer{background:var(--ink);color:var(--bone);text-align:center;padding:26px 20px calc(26px + env(safe-area-inset-bottom,0px));font-weight:600}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.modal{position:fixed;inset:0;z-index:500;background:rgba(13,10,10,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px))}
.modal[hidden]{display:none}
.box{width:min(900px,100%)}
.frame{aspect-ratio:16/9;background:#000;border:4px solid var(--bone);border-radius:12px;box-shadow:8px 8px 0 var(--red);overflow:hidden}
.frame.v{width:min(calc(82vh*.5625),92vw);width:min(calc(82dvh*.5625),92vw);margin:0 auto;aspect-ratio:9/16}
.modal.im .box{width:min(1100px,100%)}
.frame.im{aspect-ratio:auto;background:#000;display:grid;place-items:center}
.frame.im img{width:100%;height:auto;max-height:82vh;object-fit:contain;display:block}
.has-cur .frame:not(.im),.has-cur .frame:not(.im) *{cursor:auto!important}
.frame iframe{width:100%;height:100%;border:0;display:block}
.x{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:14px;width:46px;height:46px;border-radius:50%;background:var(--red);color:var(--bone);border:3px solid var(--bone);font-size:20px;font-weight:800;cursor:pointer}
.ytl{color:var(--bone);font-weight:600}
.lang{display:flex;gap:6px}.lang button{font:inherit;font-size:13px;font-weight:800;background:transparent;color:var(--bone);border:2px solid var(--bone);border-radius:8px;padding:4px 9px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--red)}
.fb{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(440px,100%),1fr));gap:26px;align-items:start}
.shot{margin:0;aspect-ratio:auto;min-height:110px;background:#000;border:4px solid var(--line);border-radius:14px;box-shadow:7px 7px 0 var(--line);overflow:hidden;display:grid;place-items:center;transition:transform .15s}
.shot:nth-child(odd){transform:rotate(-1.2deg)}.shot:nth-child(even){transform:rotate(1deg)}.shot:hover{transform:rotate(0) scale(1.03)}
.shot img{width:100%;height:auto;display:block}.shot i{font-style:normal;font-weight:800;opacity:.6;text-align:center;padding:12px}
.cur,.dot{position:fixed;left:0;top:0;pointer-events:none;z-index:1000;opacity:0;border-radius:50%}
.cur{width:44px;height:44px;margin:-22px 0 0 -22px;background:var(--red2);border:3px solid var(--ink);box-shadow:0 0 0 3px var(--white);transition:background .2s}
.cur.big{background:var(--bone)}
.dot{width:8px;height:8px;margin:-4px 0 0 -4px;background:var(--ink);border:2px solid var(--white);z-index:1001}
.has-cur,.has-cur *{cursor:none!important}
@media(pointer:coarse){.cur,.dot{display:none}}
</style>
</head>

ht:"Como funciona",steps:[["Enviar","Você manda o material bruto e as referências."],["Analisar","Eu vejo o conteúdo e combinamos estilo e prazo."],["Editar","Cortes, ritmo, efeitos e legendas."],["Entregar","Você recebe o vídeo e pede ajustes, se precisar."]],
ct:"VAMOS CONVERSAR?",cp:"Tem um projeto? Me chama e conta sobre ele.",foot:"feito com 💢 e café",yt:"Assistir no YouTube",
say:["Motion é uma arte e eu sou o artista","Quer um vídeo com ritmo? Me chama!","Corta aqui, corta ali… pronto!","Bora começar seu projeto?"]}};
const IMG="assets/ryan.jpg";
/* ===== FIM ===== */
const $=s=>document.querySelector(s),h=(a,f)=>a.map(f).join("");
let lang="en",cur="long",n=0,tm;
try{lang=localStorage.getItem("lang")||"en"}catch(e){}
document.querySelectorAll(".ryan").forEach(i=>i.src=IMG);
$("#tape").innerHTML=h([1,2,3,4,5,6],()=>h(["CUT","RHYTHM","IMPACT","EFFECTS","RETENTION"],t=>`<span>${t} ✂</span>`));
function render(){
 const L=T[lang];document.documentElement.lang=lang==="pt"?"pt-BR":"en";
 document.querySelectorAll("[data-i]").forEach(e=>e.textContent=L[e.dataset.i]);
 document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang));
 $("#chips").innerHTML=h(L.chips,c=>`<span class="chip">${c}</span>`);
 $("#steps").innerHTML=h(L.steps,s=>`<div class="step"><h3>${s[0]}</h3><p style="margin:0">${s[1]}</p></div>`);
 $("#filters").innerHTML=h(["long","short"],c=>`<button aria-pressed="${c===cur}" data-c="${c}">${L[c]}</button>`);
 $("#grid").className="grid"+(cur==="short"?" sh":"");
 $("#grid").innerHTML=h(VIDEOS.filter(v=>v.cat===cur),v=>{
  const url=v.id?`https://www.youtube.com/watch?v=${v.id}`:"#contato";
  const sh=v.cat==="short",im=v.id?`<img src="https://i.ytimg.com/vi/${v.id}/${sh?"maxresdefault":"hqdefault"}.jpg" alt="" loading="lazy" onerror="if(this.src.includes('maxres'))this.src=this.src.replace('maxresdefault','hqdefault');else this.remove()">`:"";
  return `<a class="vid" href="${url}" ${v.id?`data-id="${v.id}" data-cat="${v.cat}" target="_blank" rel="noopener"`:""}><div class="thumb">${im}<i>${v.id?"":L.vid}</i><span class="play">▶</span></div><h3>${v.title}</h3><small>${L[v.cat]}</small></a>`});
 $("#fb").innerHTML=h(FEEDBACKS,f=>`<figure class="shot">${f?`<img src="${f}" alt="" loading="lazy">`:`<i>${L.fbp}</i>`}</figure>`);
}
$("#filters").addEventListener("click",e=>{const b=e.target.closest("button");if(b){cur=b.dataset.c;render()}});
document.querySelector(".lang").addEventListener("click",e=>{const b=e.target.closest("button");if(b){lang=b.dataset.l;try{localStorage.setItem("lang",lang)}catch(x){}render()}});
render();
const md=$("#modal"),fr=$("#frame"),yt=$("#yt");
function openV(id,cat){fr.className="frame"+(cat==="short"?" v":"");fr.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0" title="Video" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;yt.hidden=false;md.classList.remove("im");yt.href=`https://www.youtube.com/watch?v=${id}`;md.hidden=false;document.body.style.overflow="hidden";$(".x").focus()}
function closeV(){md.hidden=true;fr.innerHTML="";document.body.style.overflow=""}
function openI(src){fr.className="frame im";fr.innerHTML=`<img src="${src}" alt="">`;yt.hidden=true;md.classList.add("im");md.hidden=false;document.body.style.overflow="hidden";$(".x").focus()}
$("#fb").addEventListener("click",e=>{const i=e.target.closest(".shot img");if(i)openI(i.src)});
$("#grid").addEventListener("click",e=>{const a=e.target.closest("a.vid[data-id]");if(a){e.preventDefault();openV(a.dataset.id,a.dataset.cat)}});
fr.addEventListener("mouseenter",()=>{if(fr.querySelector("iframe"))$("#cur").style.opacity=$("#dot").style.opacity=0});
md.addEventListener("click",e=>{if(e.target===md||e.target.closest(".x"))closeV()});
addEventListener("keydown",e=>{if(e.key==="Escape"&&!md.hidden)closeV()});
/* personagem */
const hero=$("#hero"),hop=$("#hop"),bub=$("#bubble");
function say(){hop.classList.remove("jump");void hop.offsetWidth;hop.classList.add("jump");
 const s=T[lang].say;bub.textContent=s[n++%s.length];bub.classList.add("on");clearTimeout(tm);tm=setTimeout(()=>bub.classList.remove("on"),2800)}
hero.addEventListener("click",say);
hero.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();say()}});
hop.addEventListener("animationend",()=>hop.classList.remove("jump"));
/* cursor fluido */
if(matchMedia("(pointer:fine)").matches){
 document.documentElement.classList.add("has-cur");
 const c=$("#cur"),d=$("#dot");let x=-100,y=-100,cx=x,cy=y,sc=1,big=0,down=0;
 addEventListener("mousemove",e=>{x=e.clientX;y=e.clientY;d.style.transform=`translate(${x}px,${y}px)`;c.style.opacity=d.style.opacity=1;
  big=e.target.closest&&e.target.closest("a,button,[role=button],.chip,.shot")?1:0});
 addEventListener("mousedown",()=>down=1);addEventListener("mouseup",()=>down=0);
 document.addEventListener("mouseleave",()=>c.style.opacity=d.style.opacity=0);
 (function loop(){const px=cx,py=cy;cx+=(x-cx)*.16;cy+=(y-cy)*.16;
  const vx=cx-px,vy=cy-py,sp=Math.min(Math.hypot(vx,vy)/26,.55),a=Math.atan2(vy,vx)*180/Math.PI;
  sc+=((big?1.9:down?.7:1)-sc)*.18;
  c.style.transform=`translate(${cx}px,${cy}px) rotate(${a}deg) scale(${sc*(1+sp)},${sc*(1-sp*.5)})`;
  c.classList.toggle("big",!!big);requestAnimationFrame(loop)})();
}
</script>
</body>
</html>
