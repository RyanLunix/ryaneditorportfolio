<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ryan — Editor de vídeos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--red:#8e1f17;--red2:#c8352a;--deep:#3b0b09;--ink:#0a0606;--bone:#f1d2b6;--white:#fff;--gold:#e9a23b;
--bg:#140b0a;--bg2:#1b0e0d;--fg:#f1d2b6;--card:#221312;--line:#000;--sh:#8e1f17;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-behavior:smooth;scroll-padding-top:70px;overflow-x:clip;-webkit-text-size-adjust:100%;background:var(--bg)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
a,button,.btn,.chip,.vid,.shot,.ryan,.play,.x{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
button:focus:not(:focus-visible),a:focus:not(:focus-visible),.ryan:focus:not(:focus-visible){outline:none}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.5;overflow-x:clip;width:100%}
h1,h2,h3{font-family:"Dela Gothic One","Arial Black",sans-serif;font-weight:400;line-height:1;margin:0}
a{color:inherit}
img{max-width:100%}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px;width:100%}
section{padding:84px 0;overflow-x:clip;position:relative}

/* gotas pretas do avatar */
.drops{position:absolute;inset:0;pointer-events:none;opacity:.5;background:
radial-gradient(ellipse 9px 15px at 20px 20px,#000 98%,transparent) 0 0/90px 90px;
-webkit-mask-image:linear-gradient(#000,transparent 70%);mask-image:linear-gradient(#000,transparent 70%)}
/* nav */
nav{position:fixed;top:0;left:0;right:0;z-index:20;padding-top:env(safe-area-inset-top,0px);background:var(--ink);border-bottom:4px solid var(--red)}
nav .wrap{display:flex;align-items:center;gap:18px;height:58px}
nav b{font-family:"Dela Gothic One",sans-serif;color:var(--bone);font-weight:400;font-size:20px;margin-right:auto;white-space:nowrap}
nav a{color:var(--bone);text-decoration:none;font-weight:600;font-size:14px;white-space:nowrap}
nav a:hover{color:var(--gold)}
nav .cta{background:var(--red);padding:8px 14px;border:2px solid var(--bone);border-radius:8px}
@media(max-width:720px){nav a:not(.cta){display:none}}
/* hero */
.hero{background:radial-gradient(ellipse at 70% 60%,#7a1a14 0,#4a0e0b 55%,#240706 100%);color:var(--bone);padding:120px 0 0;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(0,0,0,.35) 2px,transparent 2.5px);background-size:14px 14px;pointer-events:none}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:end;position:relative}
.hero h1{font-size:clamp(54px,11vw,128px);color:var(--bone);text-shadow:6px 6px 0 #000;letter-spacing:-2px}
.hero h1 span{display:block;font-size:.34em;letter-spacing:0;color:var(--gold);text-shadow:3px 3px 0 #000;margin-top:14px}
.hero p{font-size:19px;max-width:30ch;margin:22px 0 28px;font-weight:600}
.btn{display:inline-block;background:var(--bone);color:var(--ink);font-weight:800;text-decoration:none;padding:14px 22px;border:3px solid #000;border-radius:10px;box-shadow:5px 5px 0 #000;transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translate(3px,3px);box-shadow:2px 2px 0 #000}
.btn svg{width:22px;height:22px;vertical-align:-5px;fill:currentColor}
button.btn{font:inherit;font-weight:800;line-height:1.5;cursor:pointer}
button.btn.ok{background:var(--gold)}
.btn.dark{background:var(--ink);color:var(--bone);border-color:var(--bone);box-shadow:5px 5px 0 var(--red2)}
.btn.dark:hover{box-shadow:2px 2px 0 var(--red2)}
.hero-btns{display:flex;flex-wrap:wrap;gap:14px}
.hero .wrap>div:first-child{padding-bottom:72px}
.stage{position:relative;justify-self:center;width:min(420px,88vw);padding-bottom:30px}
.ryan{display:block;width:100%;border-radius:30px;border:6px solid var(--white);box-shadow:0 0 0 5px #000,12px 14px 0 5px #000;cursor:pointer;
transition:transform .35s cubic-bezier(.3,1.6,.5,1);user-select:none;-webkit-user-drag:none}
.ryan:hover{transform:rotate(-3deg) scale(1.05)}
.bob{animation:float 5s ease-in-out infinite}
.hop.jump{animation:jump .7s cubic-bezier(.3,1.4,.5,1)}
/* marcas de "!" do avatar */
.bang{position:absolute;top:-30px;right:-26px;width:60px;z-index:5;pointer-events:none;animation:pulse 1.3s infinite;filter:drop-shadow(3px 3px 0 #000)}
.mad{z-index:5;position:absolute;top:-26px;left:-34px;font-size:64px;animation:pulse 1.1s infinite;pointer-events:none;filter:drop-shadow(3px 3px 0 #000)}
.bubble{position:absolute;bottom:60px;right:-6px;max-width:190px;background:var(--bone);color:var(--ink);border:3px solid #000;border-radius:16px 16px 2px 16px;padding:9px 13px;font-weight:800;font-size:14px;transform:scale(0) rotate(-3deg);transform-origin:bottom right;transition:transform .25s cubic-bezier(.3,1.7,.5,1);z-index:6}
.bubble.on{transform:scale(1) rotate(-3deg)}
.hint{position:absolute;bottom:0;left:0;right:0;text-align:center;font-size:13px;font-weight:600;opacity:.85}
.slap{animation:slap .55s cubic-bezier(.2,1.8,.4,1) both}
.d1{animation-delay:.15s}.d2{animation-delay:.35s}.d3{animation-delay:.55s}
@keyframes slap{from{transform:scale(2.4) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-12px) rotate(1.5deg)}}
@keyframes jump{0%,100%{transform:none}30%{transform:translateY(-60px) rotate(-6deg) scale(1.06)}60%{transform:translateY(0) scale(.96,1.04)}}
@keyframes pulse{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.25) rotate(-10deg)}}
/* tape */
.tape{background:var(--gold);color:var(--ink);border-block:4px solid #000;transform:rotate(-1.5deg);margin:-30px -20px;overflow:hidden;position:relative;z-index:5}
.tape div{display:flex;gap:40px;width:max-content;padding:12px 40px 12px 0;font-family:"Dela Gothic One",sans-serif;font-size:22px;animation:run 48s linear infinite}
@keyframes run{to{transform:translateX(-50%)}}
/* títulos */
.title{font-size:clamp(30px,6vw,60px);margin-bottom:12px;display:inline-block;max-width:100%;background:var(--red);color:var(--bone);padding:8px 18px;border:4px solid #000;box-shadow:7px 7px 0 #000,0 0 0 2px rgba(241,210,182,.35);transform:rotate(-1.2deg);overflow-wrap:anywhere;position:relative}
.sub{margin:18px 0 34px;font-size:18px;max-width:50ch;opacity:.9;position:relative}
.wrap{position:relative}
.chips{display:flex;flex-wrap:wrap;gap:12px}
.chip{background:var(--card);color:var(--bone);border:3px solid #000;border-radius:999px;padding:10px 18px;font-weight:800;box-shadow:4px 4px 0 var(--red)}
.chip:nth-child(odd){transform:rotate(-2deg)}.chip:nth-child(even){transform:rotate(1.5deg);background:var(--bone);color:var(--ink);box-shadow:4px 4px 0 var(--gold)}
/* portfólio */
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:28px}
.filters button{font:inherit;font-weight:800;cursor:pointer;background:var(--card);color:var(--fg);border:3px solid #000;border-radius:10px;padding:8px 16px;box-shadow:3px 3px 0 var(--red)}
.filters button[aria-pressed="true"]{background:var(--gold);color:var(--ink);transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr));gap:26px}
.vid{display:block;text-decoration:none;background:var(--card);border:4px solid #000;border-radius:14px;box-shadow:7px 7px 0 var(--sh);overflow:hidden;transition:transform .15s,box-shadow .15s}
.vid:nth-child(3n+1){transform:rotate(-1deg)}.vid:nth-child(3n+2){transform:rotate(.8deg)}
.vid:hover{transform:rotate(0) translateY(-6px);box-shadow:7px 13px 0 var(--gold)}
.thumb{aspect-ratio:16/9;background:var(--deep);background-image:radial-gradient(rgba(0,0,0,.4) 2px,transparent 2.5px);background-size:12px 12px;display:grid;place-items:center;position:relative;border-bottom:4px solid #000}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb i{font-style:normal;color:var(--bone);font-family:"Dela Gothic One",sans-serif;text-align:center;padding:10px;font-size:15px}
.play{position:absolute;right:10px;bottom:10px;width:42px;height:42px;border-radius:50%;background:var(--gold);color:var(--ink);border:3px solid #000;display:grid;place-items:center;font-size:15px}
.vid h3{font-size:16px;padding:14px 16px 4px;line-height:1.25}
.vid small{display:block;padding:0 16px 14px;font-weight:600;opacity:.7}
.grid.sh{grid-template-columns:repeat(auto-fill,minmax(min(200px,100%),1fr));gap:24px}
.grid.sh .thumb{aspect-ratio:9/16}
.grid.sh .vid h3{font-size:15px;padding:12px 14px 4px}
.grid.sh .vid small{padding:0 14px 12px}
/* sobre */
.about{background:linear-gradient(var(--bg) 0,var(--ink) 110px,var(--ink) calc(100% - 110px),var(--bg) 100%)!important;color:var(--bone);padding:120px 0}
.about .wrap{display:grid;grid-template-columns:.8fr 1.2fr;gap:44px;align-items:center}
.about .ryan{transform:rotate(-4deg);box-shadow:0 0 0 5px var(--red2),12px 14px 0 5px var(--red2)}
.about .ryan:hover{transform:rotate(2deg) scale(1.05)}
.about .title{background:var(--bone);color:var(--ink);border-color:#000;box-shadow:7px 7px 0 var(--red2)}
.about p{font-size:19px;max-width:48ch}
/* passos */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:30px;counter-reset:s}
.step{position:relative;background:var(--card);border:4px solid #000;border-radius:14px;padding:30px 20px 20px;box-shadow:6px 6px 0 var(--sh)}
.step::before{counter-increment:s;content:counter(s);position:absolute;top:-22px;left:16px;width:46px;height:46px;display:grid;place-items:center;background:var(--gold);color:var(--ink);border:4px solid #000;border-radius:50%;font-family:"Dela Gothic One",sans-serif}
.step h3{font-size:19px;margin-bottom:6px}
/* contato */
.contact{background:linear-gradient(var(--bg) 0,#3b0b09 200px,#5a110d 70%,#000 100%)!important;color:var(--bone);text-align:center;padding-top:130px}
.contact::after{content:"";position:absolute;inset:0;-webkit-mask-image:linear-gradient(transparent 60px,#000 220px);mask-image:linear-gradient(transparent 60px,#000 220px);background-image:radial-gradient(rgba(0,0,0,.35) 2px,transparent 2.5px);background-size:14px 14px;pointer-events:none}
.contact h2{font-size:clamp(34px,7vw,72px);text-shadow:5px 5px 0 #000;overflow-wrap:anywhere}
.contact p{font-size:19px;font-weight:600}
.links{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin-top:26px}
.links .btn{max-width:100%;overflow-wrap:anywhere}
/* serrilhado tipo o cabelo do avatar */
.zz::before{content:"";position:absolute;left:0;right:0;top:-17px;height:18px;z-index:3;pointer-events:none;
background:linear-gradient(135deg,var(--zc) 25%,transparent 25%) -9px 0,linear-gradient(225deg,var(--zc) 25%,transparent 25%) -9px 0;background-size:18px 18px}
.zz::before{display:none}
.contact .wrap{z-index:2}
footer{background:#000;color:var(--bone);text-align:center;padding:26px 20px calc(26px + env(safe-area-inset-bottom,0px));font-weight:600}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.modal{position:fixed;inset:0;z-index:500;background:rgba(10,6,6,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px))}
.modal[hidden]{display:none}
.box{width:min(900px,100%)}
.frame{aspect-ratio:16/9;background:#000;border:4px solid var(--bone);border-radius:12px;box-shadow:8px 8px 0 var(--red);overflow:hidden}
.frame.v{width:min(calc(82vh*.5625),92vw);width:min(calc(82dvh*.5625),92vw);margin:0 auto;aspect-ratio:9/16}
.modal.im .box{width:min(1100px,100%)}
.frame.im{aspect-ratio:auto;background:#000;display:grid;place-items:center}
.frame.im img{width:100%;height:auto;max-height:82vh;object-fit:contain;display:block}
.has-cur .frame:not(.im),.has-cur .frame:not(.im) *{cursor:auto!important}
.frame iframe{width:100%;height:100%;border:0;display:block}
.x{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:14px;width:46px;height:46px;border-radius:50%;background:var(--red);color:var(--bone);border:3px solid var(--bone);font-size:20px;font-weight:800;cursor:pointer}
.ytl{color:var(--bone);font-weight:600}
.lang{display:flex;gap:6px}.lang button{font:inherit;font-size:13px;font-weight:800;background:transparent;color:var(--bone);border:2px solid var(--bone);border-radius:8px;padding:4px 9px;cursor:pointer;white-space:nowrap}
.lang button[aria-pressed="true"]{background:var(--red)}
.fb{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(440px,100%),1fr));gap:26px;align-items:start}
.shot{margin:0;aspect-ratio:auto;min-height:110px;background:#000;border:4px solid #000;border-radius:14px;box-shadow:7px 7px 0 var(--sh);overflow:hidden;display:grid;place-items:center;transition:transform .15s}
.shot:nth-child(odd){transform:rotate(-1.2deg)}.shot:nth-child(even){transform:rotate(1deg)}.shot:hover{transform:rotate(0) scale(1.03)}
.shot img{width:100%;height:auto;display:block}.shot i{font-style:normal;font-weight:800;opacity:.6;text-align:center;padding:12px}
.cur,.dot{position:fixed;left:0;top:0;pointer-events:none;z-index:1000;opacity:0;border-radius:50%}
.cur{width:44px;height:44px;margin:-22px 0 0 -22px;background:var(--red2);border:3px solid #000;box-shadow:0 0 0 3px var(--bone);transition:background .2s}
.cur.big{background:var(--gold)}
.dot{width:8px;height:8px;margin:-4px 0 0 -4px;background:#000;border:2px solid var(--white);z-index:1001}
.has-cur,.has-cur *{cursor:none!important}
@media(pointer:coarse){.cur,.dot{display:none}}

/* ===== TABLET / MOBILE ===== */
@media(max-width:820px){
 .hint{display:none}
 .hero .wrap{grid-template-columns:1fr;gap:0}
 .hero .wrap>div:first-child{padding-bottom:56px}
 .stage{order:-1;margin:10px auto 0;padding-bottom:0}
 .about .wrap{grid-template-columns:1fr;gap:36px}
 .about .ryan{width:min(280px,70vw);margin:0 auto}
}
@media(max-width:560px){
 section{padding:56px 0}
 .wrap{padding:0 16px}
 nav .wrap{gap:10px;height:54px}
 nav b{font-size:17px}
 nav .cta{padding:6px 10px;font-size:12px}
 .lang button{font-size:12px;padding:4px 7px}
 .hero{padding-top:90px}
 .hero h1{font-size:clamp(52px,19vw,90px);text-shadow:4px 4px 0 #000;letter-spacing:-1px}
 .hero h1 span{font-size:.3em;text-shadow:2px 2px 0 #000}
 .hero p{font-size:17px;max-width:none;margin:18px 0 22px}
 .hero-btns{flex-direction:column;align-items:stretch}
 .hero-btns .btn{text-align:center;padding:13px 18px}
 .stage{width:min(260px,68vw)}
 .ryan{border-width:5px;border-radius:24px;box-shadow:0 0 0 4px #000,8px 9px 0 4px #000}
 .about .ryan{box-shadow:0 0 0 4px var(--red2),8px 9px 0 4px var(--red2)}
 .mad{font-size:46px;top:-18px;left:-10px}
 .bang{width:42px;top:-20px;right:-8px}
 .bubble{font-size:12px;max-width:150px;right:-4px;bottom:20px;padding:7px 10px}
 .tape{margin:-22px -20px}
 .tape div{font-size:17px;gap:28px;padding:9px 28px 9px 0}
 .title{font-size:clamp(26px,9vw,40px);padding:6px 14px;border-width:3px;box-shadow:5px 5px 0 #000}
 .about .title{box-shadow:5px 5px 0 var(--red2)}
 .sub{font-size:16px;margin:14px 0 26px}
 .chips{gap:10px}
 .chip{padding:8px 14px;font-size:14px;box-shadow:3px 3px 0 var(--red)}
 .filters{margin-bottom:22px}
 .grid{gap:22px}
 .vid{border-width:3px;box-shadow:5px 5px 0 var(--sh)}
 .vid:hover{box-shadow:5px 9px 0 var(--gold)}
 .vid h3{font-size:15px;padding:12px 14px 4px}
 .vid small{padding:0 14px 12px}
 .grid.sh{grid-template-columns:repeat(2,1fr);gap:16px}
 .grid.sh .vid h3{font-size:13px;padding:10px 10px 4px}
 .grid.sh .vid small{padding:0 10px 10px;font-size:12px}
 .grid.sh .play{width:34px;height:34px;font-size:12px}
 .fb{gap:22px}
 .shot{border-width:3px;box-shadow:5px 5px 0 var(--sh)}
 .about p{font-size:17px}
 .steps{gap:34px}
 .step{border-width:3px;box-shadow:5px 5px 0 var(--sh);padding-top:40px}
 .contact h2{font-size:clamp(30px,10vw,48px);text-shadow:3px 3px 0 #000}
 .contact p{font-size:17px}
 .links{flex-direction:column;align-items:stretch;gap:14px}
 .links .btn{text-align:center;font-size:15px;padding:12px 14px}
 .frame{border-width:3px;box-shadow:5px 5px 0 var(--red)}
 .x{width:42px;height:42px;right:10px}
}
</style>
</head>
<body>
<div id="cur" class="cur"></div><div id="dot" class="dot"></div>
<nav><div class="wrap"><b>💢 RYAN</b><a href="#portfolio" data-i="nav1"></a><a href="#feedback" data-i="nav2"></a><a href="#sobre" data-i="nav3"></a><a class="cta" href="#contato" data-i="nav4"></a>
<div class="lang"><button data-l="en">🇺🇸 EN</button><button data-l="pt">🇧🇷 PT</button></div></div></nav>

<header class="hero">
<div class="wrap">
<div>
<h1 class="slap">RYAN<span class="slap d1" data-i="role"></span></h1>
<p class="slap d2" data-i="tag"></p>
<div class="slap d3 hero-btns"><a class="btn" href="#portfolio" data-i="b1"></a><a class="btn dark" href="#contato" data-i="b2"></a></div>
</div>
<div class="stage slap d1">
<svg class="bang" viewBox="0 0 60 60" aria-hidden="true"><path d="M8 4l16 4-6 26z" fill="#e8b4a8" stroke="#000" stroke-width="3" stroke-linejoin="round"/><path d="M30 38l20-8 4 12z" fill="#e8b4a8" stroke="#000" stroke-width="3" stroke-linejoin="round"/></svg>
<span class="mad" aria-hidden="true">💢</span>
<div class="bob"><div class="hop" id="hop"><img class="ryan" id="hero" alt="Ryan" role="button" tabindex="0"></div></div>
<div class="bubble" id="bubble" aria-live="polite"></div>
<div class="hint" data-i="hint"></div>
</div>
</div>
</header>
<div class="tape" aria-hidden="true"><div id="tape"></div></div>

<section><div class="drops"></div><div class="wrap">
<h2 class="title" data-i="et"></h2>
<p class="sub" data-i="ep"></p>
<div class="chips" id="chips"></div>
</div></section>

<section id="portfolio" style="padding-top:20px"><div class="wrap">
<h2 class="title" data-i="pt"></h2>
<p class="sub" data-i="ps"></p>
<div class="filters" id="filters"></div>
<div class="grid" id="grid"></div>
</div></section>

<section id="feedback" style="padding-top:20px"><div class="wrap">
<h2 class="title" data-i="ft"></h2>
<p class="sub" data-i="fs"></p>
<div class="fb" id="fb"></div>
</div></section>

<section class="about zz" id="sobre"><div class="drops"></div><div class="wrap">
<img class="ryan" alt="Ryan" tabindex="0">
<div>
<h2 class="title" data-i="at"></h2>
<p style="margin-top:22px" data-i="ap"></p>
</div>
</div></section>

<section><div class="wrap">
<h2 class="title" data-i="ht"></h2>
<div class="steps" id="steps" style="margin-top:40px"></div>
</div></section>

<section class="contact zz" id="contato"><div class="wrap">
<h2 data-i="ct"></h2>
<p data-i="cp"></p>
<div class="links">

/* ===== FIM ===== */
const $=s=>document.querySelector(s),h=(a,f)=>a.map(f).join("");
let lang="en",cur="long",n=0,tm;
try{lang=localStorage.getItem("lang")||"en"}catch(e){}
document.querySelectorAll(".ryan").forEach(i=>i.src=IMG);
$("#tape").innerHTML=h([1,2,3,4,5,6],()=>h(["CUT","RHYTHM","IMPACT","EFFECTS","RETENTION"],t=>`<span>${t} ✂</span>`));
function render(){
 const L=T[lang];document.documentElement.lang=lang==="pt"?"pt-BR":"en";
 document.querySelectorAll("[data-i]").forEach(e=>e.textContent=L[e.dataset.i]);
 document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang));
 $("#chips").innerHTML=h(L.chips,c=>`<span class="chip">${c}</span>`);
 $("#steps").innerHTML=h(L.steps,s=>`<div class="step"><h3>${s[0]}</h3><p style="margin:0">${s[1]}</p></div>`);
 $("#filters").innerHTML=h(["long","short"],c=>`<button aria-pressed="${c===cur}" data-c="${c}">${L[c]}</button>`);
 $("#grid").className="grid"+(cur==="short"?" sh":"");
 $("#grid").innerHTML=h(VIDEOS.filter(v=>v.cat===cur),v=>{
  const url=v.id?`https://www.youtube.com/watch?v=${v.id}`:"#contato";
  const sh=v.cat==="short",im=v.id?`<img src="https://i.ytimg.com/vi/${v.id}/${sh?"maxresdefault":"hqdefault"}.jpg" alt="" loading="lazy" onerror="if(this.src.includes('maxres'))this.src=this.src.replace('maxresdefault','hqdefault');else this.remove()">`:"";
  return `<a class="vid" href="${url}" ${v.id?`data-id="${v.id}" data-cat="${v.cat}" target="_blank" rel="noopener"`:""}><div class="thumb">${im}<i>${v.id?"":L.vid}</i><span class="play">▶</span></div><h3>${v.title}</h3><small>${L[v.cat]}</small></a>`});
 $("#fb").innerHTML=h(FEEDBACKS,f=>`<figure class="shot">${f?`<img src="${f}" alt="" loading="lazy">`:`<i>${L.fbp}</i>`}</figure>`);
}
$("#filters").addEventListener("click",e=>{const b=e.target.closest("button");if(b){cur=b.dataset.c;render()}});
document.querySelector(".lang").addEventListener("click",e=>{const b=e.target.closest("button");if(b){lang=b.dataset.l;try{localStorage.setItem("lang",lang)}catch(x){}render()}});
render();
const md=$("#modal"),fr=$("#frame"),yt=$("#yt");
function openV(id,cat){fr.className="frame"+(cat==="short"?" v":"");fr.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0" title="Video" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;yt.hidden=false;md.classList.remove("im");yt.href=`https://www.youtube.com/watch?v=${id}`;md.hidden=false;mc(1);document.body.style.overflow="hidden";$(".x").focus()}
function mc(on){document.documentElement.classList.toggle("has-cur",matchMedia("(pointer:fine)").matches&&!on);if(on)$("#cur").style.opacity=$("#dot").style.opacity=0}
function closeV(){md.hidden=true;fr.innerHTML="";document.body.style.overflow="";mc(0)}
function openI(src){fr.className="frame im";fr.innerHTML=`<img src="${src}" alt="">`;yt.hidden=true;md.classList.add("im");md.hidden=false;mc(1);document.body.style.overflow="hidden";$(".x").focus()}
$("#fb").addEventListener("click",e=>{const i=e.target.closest(".shot img");if(i)openI(i.src)});
$("#grid").addEventListener("click",e=>{const a=e.target.closest("a.vid[data-id]");if(a){e.preventDefault();openV(a.dataset.id,a.dataset.cat)}});
fr.addEventListener("mouseenter",()=>{if(fr.querySelector("iframe"))$("#cur").style.opacity=$("#dot").style.opacity=0});
md.addEventListener("click",e=>{if(e.target===md||e.target.closest(".x"))closeV()});
addEventListener("keydown",e=>{if(e.key==="Escape"&&!md.hidden)closeV()});
/* copiar discord */
const dc=$("#dc"),dct=$("#dct");let dtm;
dc.addEventListener("click",async()=>{
 let ok=false;
 try{await navigator.clipboard.writeText("ryanbanna");ok=true}catch(e){}
 if(!ok){try{const t=document.createElement("textarea");t.value="ryanbanna";t.style.position="fixed";t.style.opacity=0;document.body.appendChild(t);t.select();ok=document.execCommand("copy");t.remove()}catch(e){}}
 dct.textContent=ok?(lang==="pt"?"✔ Copiado!":"✔ Copied!"):"ryanbanna";
 dc.classList.toggle("ok",ok);
 clearTimeout(dtm);dtm=setTimeout(()=>{dct.textContent="ryanbanna";dc.classList.remove("ok")},1800)});
/* personagem */
const hero=$("#hero"),hop=$("#hop"),bub=$("#bubble");
function say(){hop.classList.remove("jump");void hop.offsetWidth;hop.classList.add("jump");
 const s=T[lang].say;bub.textContent=s[n++%s.length];bub.classList.add("on");clearTimeout(tm);tm=setTimeout(()=>bub.classList.remove("on"),2800)}
hero.addEventListener("click",say);
hero.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();say()}});
hop.addEventListener("animationend",()=>hop.classList.remove("jump"));
/* cursor fluido */
if(matchMedia("(pointer:fine)").matches){
 document.documentElement.classList.add("has-cur");
 const c=$("#cur"),d=$("#dot");let x=-100,y=-100,cx=x,cy=y,sc=1,big=0,down=0;
 addEventListener("mousemove",e=>{x=e.clientX;y=e.clientY;d.style.transform=`translate(${x}px,${y}px)`;c.style.opacity=d.style.opacity=md.hidden?1:0;
  big=e.target.closest&&e.target.closest("a,button,[role=button],.chip,.shot")?1:0});
 addEventListener("mousedown",()=>down=1);addEventListener("mouseup",()=>down=0);
 document.addEventListener("mouseleave",()=>c.style.opacity=d.style.opacity=0);
 (function loop(){const px=cx,py=cy;cx+=(x-cx)*.16;cy+=(y-cy)*.16;
  const vx=cx-px,vy=cy-py,sp=Math.min(Math.hypot(vx,vy)/26,.55),a=Math.atan2(vy,vx)*180/Math.PI;
  sc+=((big?1.9:down?.7:1)-sc)*.18;
  c.style.transform=`translate(${cx}px,${cy}px) rotate(${a}deg) scale(${sc*(1+sp)},${sc*(1-sp*.5)})`;
  c.classList.toggle("big",!!big);requestAnimationFrame(loop)})();
}
</script>
</body>
</html>
